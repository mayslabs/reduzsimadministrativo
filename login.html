<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Acesso interno | ReduzSim Gestão</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand: #00a383;
        --brand-dark: #074d40;
        --brand-hover: #063f35;
        --ink: #072f2a;
        --muted: #626b69;
        --border: #d8dddc;
        --surface: #ffffff;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--surface);
      }

      body {
        color: var(--ink);
        font-family: "Poppins", Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
      }

      button,
      input {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      .login-layout {
        display: grid;
        grid-template-columns: 51.25% 48.75%;
        min-height: 100vh;
        min-height: 100svh;
      }

      .brand-panel {
        background-color: var(--brand-dark);
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px);
        background-size: 56px 56px;
        color: #fff;
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
        min-height: 100svh;
        padding: 48px 56px 49px;
      }

      .brand-lockup {
        align-items: center;
        display: flex;
        gap: 14px;
        width: fit-content;
      }

      .brand-mark {
        border-radius: 11px;
        display: block;
        height: 48px;
        object-fit: cover;
        width: 48px;
      }

      .brand-wordmark {
        display: grid;
        line-height: 1;
      }

      .brand-name {
        color: #fff;
        font-size: 23px;
        font-weight: 700;
      }

      .brand-product {
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 3px;
        margin-top: 5px;
      }

      .brand-message {
        align-self: center;
        max-width: 520px;
      }

      .brand-message h1 {
        color: #fff;
        font-size: 52px;
        font-weight: 700;
        line-height: 1.08;
        margin: 0;
      }

      .brand-message h1 span {
        display: block;
      }

      .brand-message p {
        color: rgba(255, 255, 255, 0.94);
        font-size: 15px;
        line-height: 1.6;
        margin: 18px 0 0;
        max-width: 420px;
      }

      .brand-legal {
        color: #7fd9ca;
        font-size: 12px;
        margin: 0;
      }

      .form-panel {
        align-items: center;
        background: var(--surface);
        display: flex;
        justify-content: center;
        min-width: 0;
        padding: 48px;
      }

      .login-panel {
        max-width: 400px;
        width: 100%;
      }

      .eyebrow {
        color: var(--brand);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.4px;
        margin: 0 0 8px;
        text-transform: uppercase;
      }

      .login-title {
        color: var(--ink);
        font-size: 30px;
        font-weight: 700;
        line-height: 1.2;
        margin: 0;
      }

      .subtitle {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
        margin: 8px 0 29px;
      }

      .field + .field {
        margin-top: 18px;
      }

      .label-row {
        align-items: center;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        margin-bottom: 7px;
      }

      label {
        color: #111816;
        display: block;
        font-size: 12px;
        font-weight: 600;
      }

      .field > label {
        margin-bottom: 7px;
      }

      .forgot-link {
        background: transparent;
        border: 0;
        color: var(--brand);
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        margin: 0;
        padding: 0;
      }

      .forgot-link:hover,
      .forgot-link:focus-visible {
        color: var(--brand-dark);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .input-shell {
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 10px;
        display: flex;
        min-height: 49px;
        padding: 0 14px;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      .input-shell:focus-within {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(0, 163, 131, 0.12);
      }

      .input-icon {
        color: #8a9391;
        flex: 0 0 auto;
        height: 17px;
        width: 17px;
      }

      .input-shell input {
        background: transparent;
        border: 0;
        color: #17211f;
        font-size: 14px;
        min-width: 0;
        outline: 0;
        padding: 12px;
        width: 100%;
      }

      .input-shell input::placeholder {
        color: #969d9b;
        opacity: 1;
      }

      .password-toggle {
        align-items: center;
        background: transparent;
        border: 0;
        color: #6b7472;
        cursor: pointer;
        display: inline-flex;
        flex: 0 0 auto;
        height: 36px;
        justify-content: center;
        margin: 0 -6px 0 0;
        padding: 6px;
        width: 36px;
      }

      .password-toggle:hover,
      .password-toggle:focus-visible {
        color: var(--brand-dark);
      }

      .password-toggle svg {
        height: 17px;
        width: 17px;
      }

      .password-toggle [hidden] {
        display: none !important;
      }

      .remember-row {
        align-items: center;
        cursor: pointer;
        display: flex;
        font-size: 13px;
        font-weight: 400;
        gap: 10px;
        margin: 15px 0 0;
        width: fit-content;
      }

      .remember-row input {
        appearance: none;
        background: #fff;
        border: 1px solid #9ba5a2;
        border-radius: 6px;
        cursor: pointer;
        display: grid;
        height: 20px;
        margin: 0;
        place-content: center;
        width: 20px;
      }

      .remember-row input::before {
        border-color: #fff;
        border-style: solid;
        border-width: 0 2px 2px 0;
        content: "";
        height: 8px;
        margin-top: -2px;
        opacity: 0;
        transform: rotate(45deg);
        width: 4px;
      }

      .remember-row input:checked {
        background: var(--brand);
        border-color: var(--brand);
      }

      .remember-row input:checked::before {
        opacity: 1;
      }

      .remember-row input:focus-visible {
        box-shadow: 0 0 0 3px rgba(0, 163, 131, 0.16);
        outline: 0;
      }

      .submit-button {
        align-items: center;
        background: var(--brand-dark);
        border: 0;
        border-radius: 10px;
        color: #fff;
        cursor: pointer;
        display: flex;
        font-size: 14px;
        font-weight: 600;
        gap: 10px;
        justify-content: center;
        margin-top: 27px;
        min-height: 50px;
        padding: 11px 18px;
        transition: background-color 160ms ease, transform 160ms ease;
        width: 100%;
      }

      .submit-button:hover,
      .submit-button:focus-visible {
        background: var(--brand-hover);
      }

      .submit-button:active {
        transform: translateY(1px);
      }

      .submit-button:disabled,
      .forgot-link:disabled,
      .password-toggle:disabled {
        cursor: wait;
        opacity: 0.62;
      }

      .submit-button svg {
        height: 16px;
        width: 16px;
      }

      .message {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        margin: 12px 0 0;
        min-height: 0;
        text-align: center;
      }

      .message:empty {
        display: none;
      }

      .message.error {
        color: var(--danger);
      }

      .internal {
        align-items: center;
        border-top: 1px solid var(--border);
        color: var(--muted);
        display: flex;
        font-size: 11.5px;
        gap: 10px;
        margin: 29px 0 0;
        padding-top: 22px;
      }

      .internal svg {
        color: var(--brand);
        flex: 0 0 auto;
        height: 16px;
        width: 16px;
      }

      @media (max-width: 860px) {
        .login-layout {
          display: block;
        }

        .brand-panel {
          min-height: 455px;
          padding: 48px 56px 49px;
        }

        .brand-message {
          max-width: 278px;
        }

        .brand-message h1 {
          font-size: 34px;
          line-height: 1.08;
        }

        .brand-message p {
          font-size: 15px;
          line-height: 1.6;
          margin-top: 20px;
          max-width: 278px;
        }

        .brand-legal {
          line-height: 1.65;
          max-width: 280px;
        }

        .form-panel {
          align-items: flex-start;
          padding: 48px 32px 49px;
        }

        .login-panel {
          max-width: 520px;
        }
      }

      @media (max-width: 420px) {
        .brand-panel {
          padding-left: clamp(32px, 14.35vw, 56px);
          padding-right: 32px;
        }

        .form-panel {
          padding-left: 32px;
          padding-right: 32px;
        }

        .remember-row {
          align-items: flex-start;
          line-height: 1.45;
        }
      }

      @media (max-width: 350px) {
        .brand-panel,
        .form-panel {
          padding-left: 24px;
          padding-right: 24px;
        }

        .brand-message h1 {
          font-size: 31px;
        }

        .login-title {
          font-size: 27px;
        }

        .label-row {
          align-items: flex-start;
          flex-direction: column;
          gap: 5px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-layout">
      <section class="brand-panel" aria-label="ReduzSim Gestão">
        <div class="brand-lockup">
          <img class="brand-mark" src="./assets/reduzsim-sidebar-mark.png" alt="" />
          <div class="brand-wordmark" aria-label="ReduzSim Gestão">
            <span class="brand-name">ReduzSim</span>
            <span class="brand-product">GESTÃO</span>
          </div>
        </div>

        <div class="brand-message">
          <h1>
            <span>INSS reduzido,</span>
            <span>obra regularizada.</span>
          </h1>
          <p>Obras, tarefas, prazos e financeiro do escritório em um só lugar.</p>
        </div>

        <p class="brand-legal">ReduzSim Apoio Administrativo Ltda · Palmas – TO</p>
      </section>

      <section class="form-panel" aria-labelledby="loginTitle">
        <div class="login-panel">
          <p class="eyebrow">Acesso interno</p>
          <h2 id="loginTitle" class="login-title">Entrar no sistema</h2>
          <p class="subtitle">Use o mesmo e-mail e senha cadastrados no Firebase.</p>

          <form id="cloudLoginForm" novalidate>
            <div class="field">
              <label for="cloudLoginEmail">E-mail</label>
              <div class="input-shell">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect width="18" height="14" x="3" y="5" rx="2"></rect>
                  <path d="m3 7 9 6 9-6"></path>
                </svg>
                <input
                  id="cloudLoginEmail"
                  type="email"
                  inputmode="email"
                  autocomplete="username"
                  maxlength="254"
                  placeholder="nome@reduzsiminss.com.br"
                  required
                  autofocus
                />
              </div>
            </div>

            <div class="field">
              <div class="label-row">
                <label for="cloudLoginPassword">Senha</label>
                <button id="forgotPasswordButton" class="forgot-link" type="button">Esqueci minha senha</button>
              </div>
              <div class="input-shell">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect width="14" height="11" x="5" y="10" rx="2"></rect>
                  <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                </svg>
                <input
                  id="cloudLoginPassword"
                  type="password"
                  autocomplete="current-password"
                  maxlength="128"
                  placeholder="Sua senha"
                  required
                />
                <button
                  id="togglePasswordButton"
                  class="password-toggle"
                  type="button"
                  aria-label="Mostrar senha"
                  aria-pressed="false"
                  title="Mostrar senha"
                >
                  <svg data-password-icon="show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2.1 12s3.6-7 9.9-7 9.9 7 9.9 7-3.6 7-9.9 7-9.9-7-9.9-7Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg data-password-icon="hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                    <path d="m2 2 20 20"></path>
                    <path d="M6.7 6.7C3.8 8.7 2.1 12 2.1 12s3.6 7 9.9 7c1.7 0 3.1-.5 4.4-1.2"></path>
                    <path d="M10.7 5.1c.4-.1.9-.1 1.3-.1 6.3 0 9.9 7 9.9 7s-.7 1.4-2 2.9"></path>
                  </svg>
                </button>
              </div>
            </div>

            <label class="remember-row" for="rememberAccess">
              <input id="rememberAccess" type="checkbox" checked />
              <span>Manter conectada neste computador</span>
            </label>

            <button id="cloudLoginButton" class="submit-button" type="submit">
              <span data-submit-label>Entrar</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14"></path>
                <path d="m13 6 6 6-6 6"></path>
              </svg>
            </button>
            <p id="cloudLoginMessage" class="message" role="status" aria-live="polite"></p>
          </form>

          <p class="internal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3v8Z"></path>
            </svg>
            <span>Uso exclusivo da equipe ReduzSim.</span>
          </p>
        </div>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="./login.js?v=2"></script>
  </body>
</html>
