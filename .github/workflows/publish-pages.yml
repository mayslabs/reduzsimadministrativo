name: Publicar ReduzSim Gestao

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validar versao
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  publish:
    name: Publicar em producao
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://reduzsim-gestao.pages.dev/
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Publicar no Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Configure CLOUDFLARE_ACCOUNT_ID e CLOUDFLARE_API_TOKEN no ambiente production.'
            exit 1
          fi
          ./node_modules/.bin/wrangler pages deploy dist --project-name reduzsim-gestao --branch main
      - name: Verificar login e protecao da API
        run: |
          base=https://reduzsim-gestao.pages.dev
          for attempt in {1..6}; do
            login=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$base/login") || login=000
            panel=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 10 "$base/") || panel=000
            api=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$base/api/state") || api=000
            if [[ "$login" == 200 && "$panel" == "303 $base/login?next=%2F" && "$api" == 401 ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Resposta inesperada: login=$login painel=$panel API=$api"
          exit 1
